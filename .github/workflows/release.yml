name: Release

# Publishes to npm when a version tag is pushed (v1.2.3). Requires an npm token with publish
# rights stored as the NPM_TOKEN repository secret. Provenance links the package to this workflow run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION" || { echo "tag $TAG != package.json $VERSION"; exit 1; }
      - name: Skip if this version is already on npm (e.g. published manually)
        id: exists
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "realtime-channels@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $VERSION"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.skip == 'false'
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
